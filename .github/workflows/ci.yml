name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # SIFT runs on all three desktop platforms, so it is tested on all three.
    # Java 17 is the minimum supported; 21 is the current LTS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify
